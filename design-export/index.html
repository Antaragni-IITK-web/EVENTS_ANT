<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antaragni '26 - Design Sandbox</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Using Google Fonts to simulate Anton, Rakkas, and Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&family=Rakkas&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="marquee-wrapper">
        <div class="marquee-content tape">
            15+ CITIES &#9733; 6 BATTLES &#9733; ONE NATIONAL CROWN &#9733; THE FIRE SHALL RISE AGAIN
        </div>
    </div>

    <main class="hero-section">
        <!-- Floating Stickers Simulation -->
        <div class="sticker" style="top: 15%; left: 10%; transform: rotate(-10deg);">🎸</div>
        <div class="sticker" style="top: 60%; left: 80%; transform: rotate(15deg);">🎫</div>
        <div class="sticker" style="top: 30%; left: 75%; transform: rotate(-5deg);">🎤</div>
        
        <div class="hero-content">
            <span class="tape-pink rotated-subhead">Unleashing the fire within</span>
            
            <h1 class="hero-title">
                <span class="gradient-text">ANTARAGNI</span>
            </h1>
            
            <p class="hero-body">
                Four days. Hundreds of stages. One incredible story — and you're in it. The 61st edition returns louder than ever.
            </p>

            <button class="primary-btn">Explore Events &rarr;</button>
        </div>
    </main>

    <section class="grid-section">
        <h2 class="section-title">THE BATTLEGROUNDS</h2>
        <div class="card-grid">
            <div class="card">
                <div class="card-art" style="background: linear-gradient(135deg, #ffc94d, #ff5f3c);"></div>
                <h3 class="card-title">Dance</h3>
            </div>
            <div class="card">
                <div class="card-art" style="background: linear-gradient(135deg, #ff5f3c, #d92643);"></div>
                <h3 class="card-title">Music</h3>
            </div>
            <div class="card">
                <div class="card-art" style="background: linear-gradient(135deg, #8c2333, #ff8a3d);"></div>
                <h3 class="card-title">Dramatics</h3>
            </div>
        </div>
    </section>

</body>
</html>
